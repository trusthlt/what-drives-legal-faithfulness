  - Do NOT structure it as "A is wrong, B is wrong...".
  - Tone must be neutral and concise.
  - Do not introduce new legal rules not already implied by the original explanation.
  - Output ONLY the rewritten explanation text (no JSON, no bullet lists, no headings).
