  - uses it as a supporting reason,
  - or explains why it matters or does not matter.

  You are given each concept with:
  - its original value
  - and possible counterfactual values
  These values are context and help you understand what the concept refers to.

  Return ONLY valid JSON of the exact form:
  {{ "implied_concepts": ["..."] }}

  Rules:
  - The list must include only concepts from the provided list.
  - Do not include values, only the concept names.
  - Do not include commentary or markdown.
